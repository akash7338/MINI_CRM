spring:
  application:
    name: telephony-service
  
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/minigenesys_telephony}
    username: ${DB_USER:postgres}
    password: ${DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
  
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

  kafka:
    bootstrap-servers: ${KAFKA_SERVERS:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer

server:
  port: 8092

twilio:
  accountSid: ${TWILIO_ACCOUNT_SID:AC00000000000000000000000000000000}
  apiKeySid: ${TWILIO_API_KEY_SID:SK00000000000000000000000000000000}
  apiKeySecret: ${TWILIO_API_KEY_SECRET:api_key_secret_dummy_value_32_chars_long}
  twimlAppSid: ${TWILIO_TWIML_APP_SID:AP00000000000000000000000000000000}

services:
  callServiceUrl: ${CALL_SERVICE_URL:http://localhost:8087}

logging:
  file:
    name: ${LOG_FILE:logs/telephony-service.log}
  level:
    com.minigenesys.telephony: DEBUG
