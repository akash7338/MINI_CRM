server:
  port: 8080

spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      default-filters:
        - DedupeResponseHeader=Access-Control-Allow-Origin Access-Control-Allow-Credentials, RETAIN_FIRST
      routes:
        - id: user-service
          uri: http://localhost:8090
          predicates:
            - Path=/api/v1/auth/**, /api/v1/users/**
        - id: agent-state-service
          uri: http://localhost:8086
          predicates:
            - Path=/api/v1/agents/**
        - id: call-service
          uri: http://localhost:8087
          predicates:
            - Path=/api/v1/calls/**
        - id: analytics-service
          uri: http://localhost:8089
          predicates:
            - Path=/api/v1/analytics/**
        - id: websocket-gateway
          uri: http://localhost:8088
          predicates:
            - Path=/api/v1/websocket/**, /ws/**
      globalcors:
        cors-configurations:
          '[/**]':
            allowedOrigins: "http://localhost:4200"
            allowedMethods: "*"
            allowedHeaders: "*"

jwt:
  secret: "404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970" # 256-bit hex secret
  expirationMs: 3600000 # 1 hour

logging:
  level:
    com.minigenesys.apigateway: DEBUG
