server:
  port: 8080

spring:
  application:
    name: api-gateway

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
  cloud:
    gateway:
      default-filters:
        - DedupeResponseHeader=Access-Control-Allow-Origin Access-Control-Allow-Credentials, RETAIN_FIRST
      routes:
        - id: agent-state-internal-block
          uri: ${SERVICES_AGENT_STATE_URL:http://localhost:8086}
          predicates:
            - Path=/api/v1/agents/internal
          filters:
            - SetStatus=403
        - id: user-service
          uri: ${SERVICES_USER_URL:http://localhost:8090}
          predicates:
            - Path=/api/v1/auth/**, /api/v1/users/**
        - id: agent-state-service
          uri: ${SERVICES_AGENT_STATE_URL:http://localhost:8086}
          predicates:
            - Path=/api/v1/agents/**
        - id: call-service
          uri: ${SERVICES_CALL_URL:http://localhost:8087}
          predicates:
            - Path=/api/v1/calls/**
        - id: contact-service
          uri: ${SERVICES_CONTACT_URL:http://localhost:8095}
          predicates:
            - Path=/api/v1/contacts/**
        - id: analytics-service
          uri: ${SERVICES_ANALYTICS_URL:http://localhost:8089}
          predicates:
            - Path=/api/v1/analytics/**
        - id: websocket-gateway
          uri: ${SERVICES_WEBSOCKET_URL:http://localhost:8088}
          predicates:
            - Path=/api/v1/websocket/**, /ws/**
        - id: telephony-service
          uri: ${SERVICES_TELEPHONY_URL:http://localhost:8092}
          predicates:
            - Path=/api/v1/telephony/**
        - id: diagnostics-service
          uri: ${SERVICES_DIAGNOSTICS_URL:http://localhost:8094}
          predicates:
            - Path=/api/v1/diagnostics/**
      globalcors:
        cors-configurations:
          '[/**]':
            allowedOrigins: 
              - "http://localhost:4200"
              - "http://127.0.0.1:4200"
            allowedMethods: "*"
            allowedHeaders: "*"
            allowCredentials: true

jwt:
  secret: "404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970" # 256-bit hex secret
  expirationMs: 3600000 # 1 hour

logging:
  file:
    name: ${LOG_FILE:logs/api-gateway.log}
  level:
    com.minigenesys.apigateway: DEBUG
